# Server-side stack: Traefik terminating TLS in front of the game. No login: the test build is
# kept private by living on an unlisted hostname that is never linked or indexed. Anyone who
# learns the hostname can play, so pick a random subdomain and share it only with testers.
#
# The certificate is a wildcard (*.example.com) issued over a Cloudflare DNS-01 challenge, so the
# test hostname never appears in a public Certificate Transparency log. An http-01 challenge would
# publish the exact subdomain within minutes and defeat the point of an unlisted host.
#
#   touch ./traefik/acme.json && chmod 600 ./traefik/acme.json
#   cat > .env <<'ENV'
#   MEXE_HOST=k3f9x2.example.com
#   MEXE_DOMAIN=example.com
#   ACME_EMAIL=admin@example.com
#   CLOUDFLARE_DNS_API_TOKEN=...
#   ENV
#   chmod 600 .env
#   docker compose -f docker-compose.traefik.yml up -d --build
services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      # Nothing is exposed unless it says traefik.enable=true.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      # Ask Cloudflare's own resolvers, not the host's: a stale local cache makes Traefik give up
      # on a TXT record that is already live.
      - --certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
    environment:
      # Scope the token to Zone:DNS:Edit on this one zone. It can rewrite the zone's records,
      # so it belongs in a chmod 600 .env, never in the compose file or git.
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:?set CLOUDFLARE_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only: Traefik only needs to watch the container list, never to drive the daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme.json
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mexe:
    build:
      context: .
      target: web
      args:
        # Empty is right here: served over HTTPS, the client defaults to wss://<host>/ws.
        VITE_WS_URL: ${VITE_WS_URL:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.mexe.rule=Host(`${MEXE_HOST:?set MEXE_HOST}`)
      - traefik.http.routers.mexe.entrypoints=websecure
      - traefik.http.routers.mexe.tls.certresolver=le
      - traefik.http.routers.mexe.tls.domains[0].main=${MEXE_DOMAIN:?set MEXE_DOMAIN}
      - traefik.http.routers.mexe.tls.domains[0].sans=*.${MEXE_DOMAIN}
      - traefik.http.routers.mexe.middlewares=mexe-noindex
      # The only thing keeping the test private is that nobody links to the host. Tell crawlers
      # so an accidental link never turns into a search result.
      - traefik.http.middlewares.mexe-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow
      - traefik.http.services.mexe.loadbalancer.server.port=80
    depends_on:
      # Startup order only: the web container is static and local play never needs the
      # server, but online alpha testers should not reach a page whose server is not up yet.
      mexe-server:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Online alpha only. Local play never contacts this service.
  mexe-server:
    build:
      context: .
      target: server
    environment:
      MEXE_ENV: production
      MEXE_METRICS_TOKEN: ${MEXE_METRICS_TOKEN:-}
      # Browser origins allowed to open a WebSocket, comma-separated — your site's own
      # origin(s). `*` accepts any origin, which is the right answer only when the server is
      # reached through someone else's proxy or by non-browser clients. Required in production:
      # the server refuses to start rather than let an omission pass for a decision.
      MEXE_ALLOWED_ORIGINS: ${MEXE_ALLOWED_ORIGINS:?set MEXE_ALLOWED_ORIGINS to your site origin(s), or * to accept any}
      # Rooms one client address may create per minute.
      MEXE_MAX_ROOM_CREATES_PER_IP: ${MEXE_MAX_ROOM_CREATES_PER_IP:-}
      # Reverse proxies in front of this server. Traefik terminates and appends the client address to X-Forwarded-For.
      MEXE_TRUSTED_PROXY_HOPS: ${MEXE_TRUSTED_PROXY_HOPS:-1}
    labels:
      - traefik.enable=true
      # Higher priority than the catch-all above, or the upgrade 404s.
      - traefik.http.routers.mexe-ws.rule=Host(`${MEXE_HOST}`) && PathPrefix(`/ws`)
      - traefik.http.routers.mexe-ws.priority=100
      - traefik.http.routers.mexe-ws.entrypoints=websecure
      - traefik.http.routers.mexe-ws.tls.certresolver=le
      - traefik.http.routers.mexe-ws.tls.domains[0].main=${MEXE_DOMAIN}
      - traefik.http.routers.mexe-ws.tls.domains[0].sans=*.${MEXE_DOMAIN}
      - traefik.http.services.mexe-ws.loadbalancer.server.port=8787
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      # Without these, the first verdict waits a full interval and the web container idles
      # ~30s after the server is already answering. Needs Docker Engine 25+ / Compose 2.24+.
      start_period: 30s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
