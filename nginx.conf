# Static-game server block for the `web` image. Replaces nginx's stock default.conf for one
# reason: access logging is off. A request line would persist the client IP, the user agent,
# the referrer and the full URL for every asset fetch — none of which the game needs and all
# of which is personal data. Error logging stays on (main nginx.conf, /var/log/nginx/error.log)
# because a 5xx or a broken upstream is the thing an operator actually has to see.
server {
    listen       80;
    server_name  localhost;

    access_log off;

    # Error logging stays on, but at `crit` rather than the default `error`. nginx writes the
    # client IP and the full request line into *every* error entry, and at the default level a
    # missing favicon is an error entry — so the default would quietly persist an IP per 404.
    # `crit` keeps the failures an operator must act on (worker/socket/config failures; `emerg`
    # config errors are above it and always logged) and drops the per-request 4xx noise.
    error_log /var/log/nginx/error.log crit;

    # Security headers (docs/THREAT_MODEL.md TM-15). `always` so they are set on error
    # responses too — a 404 page is still a page a browser executes in this origin.
    #
    # The CSP is as tight as a canvas game can be: no third-party script, style, font or frame
    # anywhere in the product, so everything is 'self'. Two deliberate loosenings:
    #   - style-src 'unsafe-inline' — index.html carries the boot stylesheet inline (it has to
    #     paint before any JS loads), and the DOM overlay plates set style attributes.
    #   - connect-src ws: wss: — the room server is a separate deployment whose URL is build- or
    #     query-configured (VITE_WS_URL, ?ws=), so its origin is not known here.
    # 'unsafe-eval' is deliberately absent: neither Phaser nor the Vite output needs it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Belt to the CSP's frame-ancestors braces, for anything that predates CSP support.
    add_header X-Frame-Options "DENY" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
