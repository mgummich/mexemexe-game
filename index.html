<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>MEXEMEXE! — Arruma. Desarruma. Bate.</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1a0f0a" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1a0f0a;
        height: 100%;
        overflow: hidden;
        /* iOS Safari: no rubber-band scroll or double-tap zoom stealing drags */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
      }
      #game {
        width: 100vw;
        /* 100dvh so the iOS Safari toolbar showing/hiding doesn't crop the canvas */
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Notch / home-indicator safe areas: keep the canvas clear of the cutout, viewport-fit=cover above. */
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      canvas {
        image-rendering: pixelated;
        touch-action: none;
        display: block;
      }
      /* Paints before any JS/Phaser loads — cold boot can spend 10-25s probing/loading assets
         with nothing else on screen, which reads as a crash. Removed by BootScene once the menu
         is actually up (see src/scenes/BootScene.ts). */
      #boot-loading {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a0f0a;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #boot-loading div {
        width: 16px;
        height: 16px;
        background: #f7d23e;
        animation: boot-blink 0.9s steps(2) infinite;
      }
      @keyframes boot-blink {
        50% {
          opacity: 0.2;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-loading"><div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
