version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint 8.x peers typescript <6.1; lift once it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Base images are pinned by version and digest; this keeps the pins current.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Odd Node majors never become LTS; move LTS lines by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
