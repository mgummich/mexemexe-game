name: _exp

# Throwaway measurement workflow — deleted once the numbers are in.
on:
  push:
    branches: [ci/quality-gates]

permissions:
  contents: read

jobs:
  serial-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test e2e/screenshot.spec.ts --grep-invert @perf --workers=1

  serial-notrace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: MEXE_NO_TRACE=1 npx playwright test e2e/screenshot.spec.ts --grep-invert @perf --workers=1

  parallel-notrace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: nproc
      - run: MEXE_NO_TRACE=1 npx playwright test e2e/screenshot.spec.ts --grep-invert @perf

  perf-notrace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Same three fps tests, repeated, with tracing off — is the CI fps floor real or was it
      # the tracer?
      - run: MEXE_FPS_GATE=1 MEXE_NO_TRACE=1 npx playwright test e2e/screenshot.spec.ts --grep @perf --workers=1 --repeat-each=3

  multiplayer-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Reproduction rate of the double-click guard failure, tracing on (as CI now runs it).
      - run: npx playwright test -c playwright.multiplayer.config.ts --grep "impatient" --repeat-each=5
