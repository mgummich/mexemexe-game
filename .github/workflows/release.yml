name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $GITHUB_REF_NAME != package.json $pkg"; exit 1; }

      - name: Extract the release notes from CHANGELOG.md
        run: node scripts/release.mjs --notes "${GITHUB_REF_NAME#v}" > notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "MEXE! ${GITHUB_REF_NAME}" --notes-file notes.md

  images:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lowercase the image prefix
        id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The static game. VITE_WS_URL is baked at build time and left empty here,
      # so this image plays offline and talks to a same-host server; point it at
      # your own wss:// endpoint by building locally (see SELF_HOSTING.md).
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}-web:${{ github.ref_name }}
            ${{ steps.prefix.outputs.value }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}-server:${{ github.ref_name }}
            ${{ steps.prefix.outputs.value }}-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
