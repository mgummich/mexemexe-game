name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which suites this change can possibly affect. Deliberately crude, because a wrong answer here
  # costs coverage: only two narrow shapes shrink the run, and everything else falls through to
  # the full set (docs/TESTING.md, "Which gate runs when").
  #
  #   docs_only    - only Markdown, the roadmap status JSON or LICENSE changed. No code runs.
  #   server_only  - only server/ and tests/server/ changed. Client rendering cannot move, so the
  #                  browser rendering/layout/PWA suites have nothing to prove; the multiplayer
  #                  suite and the server image still run, because the server is what changed.
  #   otherwise    - everything, including any touch of src/, public/, index.html, a config file,
  #                  package.json, the lockfile or this workflow.
  #
  # A push to main never shrinks: that run is what promotes the public build.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      server_only: ${{ steps.classify.outputs.server_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then
            echo "not a pull request - running everything"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "server_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE" "$HEAD")"
          echo "changed files:"; echo "$files"
          docs_only=true; server_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/ROADMAP_STATUS.json|LICENSE) ;;
              *) docs_only=false ;;
            esac
            case "$f" in
              server/*|tests/server/*|*.md|docs/ROADMAP_STATUS.json) ;;
              *) server_only=false ;;
            esac
          done <<< "$files"
          # An empty diff is not a licence to skip.
          if [ -z "$files" ]; then docs_only=false; server_only=false; fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "server_only=$server_only" >> "$GITHUB_OUTPUT"

  docs:
    name: Docs site builds
    needs: scope
    # Runs for *every* change, including documentation-only ones — the only job that does.
    # `mkdocs build --strict` is what the Pages deploy runs, and a broken cross-document link
    # fails it; before this job that failure could only be discovered after merging, by the
    # deploy itself (it was, once: CONTRIBUTING.md is symlinked into docs/, so a link written
    # relative to the repository root resolves nowhere inside the site).
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict -d /tmp/site

  test:
    name: Lint, unit tests & build
    needs: scope
    # Lint and the unit suites are cheap and cover the docs' own link and copy checks, so they run
    # for everything except a pure documentation change.
    if: needs.scope.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  server-image:
    name: Server image boots unprivileged
    needs: scope
    if: needs.scope.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    # The images were only ever built at release time, so a Dockerfile change was first exercised
    # by a deploy. This builds the server stage and proves the two things the image has to do:
    # answer /health, and not be root while doing it (docs/THREAT_MODEL.md TM-16).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the server stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          load: true
          tags: mexe-server:ci
          cache-from: type=gha,scope=server-ci
          cache-to: type=gha,mode=max,scope=server-ci
      - name: Boot it and check /health
        run: |
          docker run -d --name mexe-server -p 8787:8787 mexe-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8787/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
      - name: It must not be running as root
        run: |
          whoami_in_container=$(docker exec mexe-server whoami)
          echo "container user: $whoami_in_container"
          test "$whoami_in_container" = "node"
      - name: Stop it
        if: always()
        run: docker rm -f mexe-server || true

  multiplayer:
    name: Multiplayer verification
    needs: scope
    if: needs.scope.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    # Chromium only on the PR path. The three-engine run was the longest job on every PR (~18m)
    # and most of that is the lobby state machine replayed on Firefox and WebKit; that replay now
    # runs in the nightly `multiplayer-all-engines` job instead. Engine parity is therefore a
    # nightly guarantee, not a per-PR one — a WebSocket/storage/orientation regression that only
    # shows on Firefox or WebKit is caught within a day rather than at review time.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Spawns the real WS server and gates on server stderr, client console errors, accepted
      # illegal proposals and missing screenshots (scripts/check-verify-multiplayer.mjs). The
      # --engines=chromium the script gets from this npm script is what keeps it from demanding
      # the Firefox/WebKit lobby evidence this run no longer produces.
      - run: npm run verify:multiplayer:chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: multiplayer-artifacts
          path: |
            test-results/
            docs/screenshots/verify-multiplayer-log.json
          retention-days: 7

  pwa:
    name: PWA offline verification
    needs: scope
    # A server-only change cannot move the service worker or the offline cache.
    if: needs.scope.outputs.docs_only == 'false' && needs.scope.outputs.server_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium only: this suite drives the service worker lifecycle and the offline cache,
      # not rendering across engines.
      - run: npx playwright install --with-deps chromium
      # Builds, then serves dist/ — the service worker only registers in a production build
      # (see src/core/pwa.ts). Covers offline reload, offline local/AI/tutorial play, the
      # online-rooms-disabled-offline path, first install, and the update handover.
      - run: npm run verify:pwa
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pwa-artifacts
          path: |
            test-results/
            docs/screenshots/pwa/pwa-log.json
          retention-days: 7

  e2e:
    name: Playwright e2e
    needs: scope
    # Rendering and gameplay journeys: nothing in server/ changes what a canvas paints.
    if: needs.scope.outputs.docs_only == 'false' && needs.scope.outputs.server_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium only: screenshot.spec.ts drives rendering/gameplay, not cross-engine layout
      # (the cross job covers that).
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # The three fps-asserting tests are tagged @perf and run first, serially, with retries
      # disabled: a fps measurement retried into passing hides exactly the regression it exists
      # to catch. Running perf first also means it measures a cold runner instead of one already
      # hot from the ~4-minute fullyParallel (playwright.config.ts) pass below — that ordering
      # was flipped after a run where fps read 42 against a floor of 50 for stress-table (and
      # crowded-table-max, table-zoomed similarly low) measured after the parallel pass, on a run
      # where a cold job read comfortably above every floor. Each pass writes its own shard under
      # docs/screenshots/verify-log-parts/ (see e2e/screenshot.spec.ts's afterAll) — the second
      # pass sets MEXE_KEEP_VERIFY_LOG so global-setup.ts doesn't wipe the first pass's shards.
      - run: npx playwright test e2e/screenshot.spec.ts --grep @perf --workers=1 --retries=0
      - run: MEXE_KEEP_VERIFY_LOG=1 npx playwright test e2e/screenshot.spec.ts --grep-invert @perf
      # This gate (console/page errors, screenshot exists, fps floors, EXPECTED_SHOTS present)
      # never ran in CI before — only locally — so console errors or missing screenshots were
      # only ever caught by hand.
      - run: node scripts/check-verify.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            test-results/
            docs/screenshots/verify-log.json
            docs/screenshots/verify-log-parts/
          retention-days: 7

  cross:
    name: Cross-browser layout
    needs: scope
    # Layout across engines and viewports - same reasoning as the e2e job.
    if: needs.scope.outputs.docs_only == 'false' && needs.scope.outputs.server_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      # layout gate: canvas fits/centres on Chrome, Firefox, Safari and phone viewports
      - run: npx playwright test -c playwright.cross.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cross-browser-artifacts
          path: |
            test-results/
          retention-days: 7
