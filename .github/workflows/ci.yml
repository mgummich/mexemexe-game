name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  multiplayer:
    name: Multiplayer verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium only: the multiplayer spec drives the protocol and the server, not rendering
      # across engines (the cross-browser gate in the e2e job covers that).
      - run: npx playwright install --with-deps chromium
      # Spawns the real WS server and gates on server stderr, client console errors, accepted
      # illegal proposals and missing screenshots (scripts/check-verify-multiplayer.mjs).
      - run: npm run verify:multiplayer
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: multiplayer-artifacts
          path: |
            test-results/
            docs/screenshots/verify-multiplayer-log.json
          retention-days: 7

  pwa:
    name: PWA offline verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium only: this suite drives the service worker lifecycle and the offline cache,
      # not rendering across engines.
      - run: npx playwright install --with-deps chromium
      # Builds, then serves dist/ — the service worker only registers in a production build
      # (see src/core/pwa.ts). Covers offline reload, offline local/AI/tutorial play, the
      # online-rooms-disabled-offline path, first install, and the update handover.
      - run: npm run verify:pwa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pwa-artifacts
          path: |
            test-results/
            docs/screenshots/pwa/pwa-log.json
          retention-days: 7

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium only: screenshot.spec.ts drives rendering/gameplay, not cross-engine layout
      # (the cross job covers that).
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # The three fps-asserting tests are tagged @perf and run first, serially, with retries
      # disabled: a fps measurement retried into passing hides exactly the regression it exists
      # to catch. Running perf first also means it measures a cold runner instead of one already
      # hot from the ~4-minute fullyParallel (playwright.config.ts) pass below — that ordering
      # was flipped after a run where fps read 42 against a floor of 50 for stress-table (and
      # crowded-table-max, table-zoomed similarly low) measured after the parallel pass, on a run
      # where a cold job read comfortably above every floor. Each pass writes its own shard under
      # docs/screenshots/verify-log-parts/ (see e2e/screenshot.spec.ts's afterAll) — the second
      # pass sets MEXE_KEEP_VERIFY_LOG so global-setup.ts doesn't wipe the first pass's shards.
      - run: MEXE_NO_TRACE=1 npx playwright test e2e/screenshot.spec.ts --grep @perf --workers=1 --retries=0
      - run: MEXE_KEEP_VERIFY_LOG=1 npx playwright test e2e/screenshot.spec.ts --grep-invert @perf
      # This gate (console/page errors, screenshot exists, fps floors, EXPECTED_SHOTS present)
      # never ran in CI before — only locally — so console errors or missing screenshots were
      # only ever caught by hand.
      - run: node scripts/check-verify.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            test-results/
            docs/screenshots/verify-log.json
            docs/screenshots/verify-log-parts/
          retention-days: 7

  cross:
    name: Cross-browser layout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      # layout gate: canvas fits/centres on Chrome, Firefox, Safari and phone viewports
      - run: npx playwright test -c playwright.cross.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cross-browser-artifacts
          path: |
            test-results/
          retention-days: 7
