name: Deploy to GitHub Pages

on:
  # After CI, not beside it. On a `push` trigger this workflow raced the CI run on the same
  # commit, so a main that failed lint, the unit suites or the multiplayer/PWA gates still
  # published a playable build. `workflow_run` with a success check makes the public build the
  # promotion of a green commit rather than of the newest one.
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A manual dispatch deploys whatever it was pointed at; an automatic run only ever deploys a
    # commit whose CI passed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI actually tested, not whatever main points at by the time this starts.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Assemble site (game at /, docs at /docs)
        run: |
          mkdir -p site
          cp -r dist/* site/
          mkdocs build --strict -d site/docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
