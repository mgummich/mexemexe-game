name: Nightly

on:
  schedule:
    # 04:00 UTC daily
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly

jobs:
  specialized-tests:
    name: Extended fuzz, golden replays & session soak
    runs-on: ubuntu-latest
    # `npm run test` already runs these properties at the fast budget on every PR; this is the
    # same properties at the extended iteration count (MEXE_FUZZ=extended), which is the part that
    # only ever ran when somebody remembered to. Measured ~9s locally, so the timeout is slack for
    # a cold shared runner rather than a real bound.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No browser install: both suites are pure node.
      - run: npm run test:property
      - run: npm run test:replay
      # Same soak the PR path runs at two room lifecycles, here at eight (~45s): long-session
      # drift in the socket/seat bookkeeping needs the repeats, and the repeats need the wall
      # clock this job has and a PR does not.
      - run: MEXE_SOAK=1 npx vitest run tests/server/session-soak.integration.test.ts

  perf-trend:
    name: Performance trend
    runs-on: ubuntu-latest
    # Prints, never gates. The budgets in docs/PERFORMANCE.md are the contract and the three @perf
    # fps tests are the gate; this job exists so boot time, heap and the per-cycle drift have a
    # dated series to read when one of them starts moving, instead of being measured once a year
    # by whoever notices.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Measure (PERF / PERF-THROTTLED / PROFILE-TOP / MEM-DELTA in the log)
        run: npx playwright test e2e/perf-measure.spec.ts --workers=1 --retries=0

  visual-baseline:
    name: Visual baselines
    runs-on: ubuntu-latest
    # Nightly, and on the runner whose renderer the committed linux baselines were captured on.
    # A first run on a platform with no baseline *writes* one and fails; that artifact is the
    # candidate a human looks at and commits (docs/TESTING.md, "Visual baselines").
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-baseline-candidates
          path: |
            e2e/visual.spec.ts-snapshots/
            test-results/
          retention-days: 14

  dependency-audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    # Nightly, not per-PR: a new advisory published mid-review is not the reviewer's problem, and a
    # gate that fails for reasons unrelated to the diff gets ignored. Runtime deps are audited at a
    # lower threshold than dev tooling, because only they reach a player or a served room.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Runtime dependencies (phaser, tsx, ws)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Dev tooling
        run: npm audit --audit-level=high
      - name: Report anything outdated (never fails the job)
        run: npm outdated || true

  flake-detection:
    name: WebKit touch flake detection
    runs-on: ubuntu-latest
    # ~35s install + 5 repeats x 2 projects of a suite measured at 2m04 for all 8 projects combined
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      # Repeated, retry-free run of the two historically flaky WebKit touch profiles. A single
      # flaky drop is expected occasionally; a *repeated* failure across 5 runs is a real signal,
      # so retries stay at 0 here (unlike the CI cross-browser gate, which retries once).
      - run: MEXE_TRACE=1 npx playwright test -c playwright.cross.config.ts --project="ios safari" --project="ipad" --repeat-each=5 --retries=0
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: flake-detection-artifacts
          path: test-results/
          retention-days: 7

  screenshot-suite-no-retry:
    name: Screenshot suite (no retry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium only, same as CI's e2e job.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Same two-pass split as CI's e2e job, but traced (MEXE_TRACE=1): tracing is off by default
      # on the PR path (see playwright.config.ts) because it's expensive and it skews the fps
      # gates, so this nightly run is where the suite gets a traced pass instead.
      - run: MEXE_TRACE=1 npx playwright test e2e/screenshot.spec.ts --grep @perf --workers=1 --retries=0
      - run: MEXE_TRACE=1 MEXE_KEEP_VERIFY_LOG=1 npx playwright test e2e/screenshot.spec.ts --grep-invert @perf --retries=0
      - run: node scripts/check-verify.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-suite-no-retry-artifacts
          path: |
            test-results/
            docs/screenshots/verify-log.json
            docs/screenshots/verify-log-parts/
          retention-days: 7

  cross-browser-matrix:
    name: Full cross-browser matrix
    runs-on: ubuntu-latest
    # measured verify:cross runtime 2m04 plus ~52s browser install
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify:cross
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cross-browser-matrix-artifacts
          path: test-results/
          retention-days: 7

  fps-drift:
    name: fps drift (untraced, repeated)
    runs-on: ubuntu-latest
    # ~35s install + 5 repeats of the 3 @perf tests, untraced — this is the trend line for
    # table-zoomed/stress-table/crowded-table-max instead of a single cold-runner sample.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test e2e/screenshot.spec.ts --grep @perf --workers=1 --retries=0 --repeat-each=5
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fps-drift-artifacts
          path: |
            test-results/
            docs/screenshots/verify-log.json
            docs/screenshots/verify-log-parts/
          retention-days: 7

  multiplayer-all-engines:
    name: Multiplayer, all engines (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # The engine parity the PR job gave up (see ci.yml's multiplayer job): the lobby state machine
    # on Chromium, Firefox and WebKit plus the iOS-viewport WebKit spec, gated by the full
    # check-verify-multiplayer.mjs (all three engines demanded, since nothing here is engine-
    # limited).
    #
    # Six shards, ONE worker each, same as ci.yml and for the same reason. This job was red every
    # night from 2026-09-16 to 2026-09-20 on `page.waitForFunction` timeouts (OD-28/OD-29, OM-07,
    # LB-17, LB-18) — never a product failure, always the runner. It runs strictly more tests
    # concurrently than anything else: every engine's lobby replay, the iOS spec and @chaos on top
    # of the full Chromium suite, all on 4 shared cores, and the nightly-only path kept growing
    # (seat-gap lobby tests, @chaos moved here, then ios-lobby.spec.ts). Two workers each holding
    # 2-4 browser contexts plus a server is what tipped it; one test per runner is what fixes it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:multiplayer -- --shard=${{ matrix.shard }}/6 --workers=1
      # Staged into one directory so upload-artifact roots every shard's artifact at the same
      # depth whichever parts a shard happened to produce. verify-lobby-ios-log.json is a plain
      # file, not a parts directory, and only the shard that drew the WebKit iOS spec writes it.
      - name: Stage this shard's evidence
        if: always()
        run: |
          mkdir -p evidence
          for d in verify-multiplayer-log-parts verify-lobby-log-parts; do
            if [ -d "docs/screenshots/$d" ]; then cp -r "docs/screenshots/$d" evidence/; fi
          done
          if [ -f docs/screenshots/verify-lobby-ios-log.json ]; then
            cp docs/screenshots/verify-lobby-ios-log.json evidence/
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: multiplayer-all-engines-evidence-${{ matrix.shard }}
          path: evidence
          if-no-files-found: warn
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: multiplayer-all-engines-artifacts-${{ matrix.shard }}
          path: |
            test-results/
            docs/screenshots/verify-multiplayer-log.json
            docs/screenshots/verify-lobby-log.json
            docs/screenshots/verify-lobby-ios-log.json
          retention-days: 7

  multiplayer-all-engines-gate:
    # Keeps the old job's name: this is the check that says engine parity held.
    name: Multiplayer, all engines
    needs: multiplayer-all-engines
    # A skipped job is not a failed one, so run always and fail on the shards' result instead.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard must have passed
        if: needs.multiplayer-all-engines.result != 'success'
        run: |
          echo "all-engines shards: ${{ needs.multiplayer-all-engines.result }}"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: multiplayer-all-engines-evidence-*
          merge-multiple: true
          path: docs/screenshots
      # No --engines and no --skip-endurance: the nightly gate is the strict one, demanding lobby
      # evidence from all three engines, the three-match endurance run and the iOS WebKit gate.
      - run: node scripts/check-verify-multiplayer.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: multiplayer-all-engines-gate-evidence
          path: |
            docs/screenshots/verify-multiplayer-log.json
            docs/screenshots/verify-lobby-log.json
            docs/screenshots/verify-lobby-ios-log.json
          retention-days: 7

  multiplayer-traced:
    name: Multiplayer, traced (race stress, shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # Tracing slows frame processing enough to lose races a fast machine always wins — that is
    # how the double-click create_room duplicate was found (5/5 reproduction under tracing, 0/5
    # without). It costs wall clock (verify:multiplayer 2m14 -> 5m02), so it lives here instead
    # of on every PR, and it doubles as the traced-diagnostics run for this suite.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Chromium only, and therefore the suite rather than `verify:multiplayer`: this job exists
      # to lose races under tracing, and the Firefox/WebKit lobby evidence its gate would want
      # comes from multiplayer-all-engines above. Tracing roughly doubles the wall clock, which is
      # why this job is sharded one-test-per-runner too: tracing is meant to lose races by
      # slowing frame processing, not by starving the runner of cores. It was red every night
      # from 2026-09-16 with the same `page.waitForFunction` timeouts as the job above.
      # --timeout raises the per-test budget for this run only: playwright.multiplayer.config.ts
      # sets 180s, sized for the untraced suite, and LB-17, LB-18 and OD-28/OD-29 all landed at
      # 3.0-3.1m under tracing on 2026-09-20. Tracing is supposed to cost wall clock; the budget
      # has to say so rather than turning every slow-but-correct traced test red.
      - run: MEXE_TRACE=1 npx playwright test -c playwright.multiplayer.config.ts --project=chromium --shard=${{ matrix.shard }}/6 --workers=1 --timeout=540000
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: multiplayer-traced-artifacts-${{ matrix.shard }}
          path: |
            test-results/
            docs/screenshots/verify-multiplayer-log.json
          retention-days: 7
